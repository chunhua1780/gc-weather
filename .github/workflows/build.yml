name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [core-updated]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 外壳仓库：只有图标和这个 workflow。界面代码一律来自内核。
    - uses: actions/checkout@v4
    # 内核（唯一真源）。以前每个外壳仓库各存一份 index.html，靠手工复制同步，
    # 三份之间漂出了 400~700 行差异 —— 现在改成构建时拉取。
    - uses: actions/checkout@v4
      with:
        repository: chunhua1780/ghostchat
        ref: main
        path: core
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install Cordova
      run: npm install -g cordova
    - name: Build APK
      run: |
        cordova create app com.gc.weather "天气"
        # 内核 + 外壳配置 → 品牌化的 www（脚本自带校验，出错直接失败）
        node core/tools/build-shell.js --shell=weather --out=app/www
        # 外壳自己的图标覆盖内核的默认图标
        for f in icon192.png icon512.png icon-maskable.png apple-touch-icon.png; do
          [ -f "$f" ] && cp "$f" app/www/
        done
        mkdir -p app/res
        cp icon512.png app/res/icon.png
        cp icon-background.png app/res/icon-background.png
        cp icon-foreground.png app/res/icon-foreground.png
        cd app
        cordova platform add android
        cordova plugin add onesignal-cordova-plugin
        sed -i 's|</widget>|    <preference name="android-windowSoftInputMode" value="adjustResize"/>\n    <preference name="Orientation" value="portrait"/>\n    <platform name="android">\n        <icon src="res/icon.png"/>\n        <icon density="ldpi" background="res/icon-background.png" foreground="res/icon-foreground.png"/>\n        <icon density="mdpi" background="res/icon-background.png" foreground="res/icon-foreground.png"/>\n        <icon density="hdpi" background="res/icon-background.png" foreground="res/icon-foreground.png"/>\n        <icon density="xhdpi" background="res/icon-background.png" foreground="res/icon-foreground.png"/>\n        <icon density="xxhdpi" background="res/icon-background.png" foreground="res/icon-foreground.png"/>\n        <icon density="xxxhdpi" background="res/icon-background.png" foreground="res/icon-foreground.png"/>\n    </platform>\n</widget>|' config.xml
        # 最近任务列表缩略图 + 截屏防护。FLAG_SECURE 是 Android 上唯一真正
        # 有效的办法：系统直接不给这个窗口截图，缩略图变成纯色。
        # 不引第三方插件，直接改生成出来的 MainActivity，找不到就跳过，绝不卡构建。
        MA=$(find platforms/android -name MainActivity.java | head -1)
        MK=$(find platforms/android -name MainActivity.kt | head -1)
        if [ -n "$MA" ]; then
          sed -i 's|super.onCreate(savedInstanceState);|&\n        getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE, android.view.WindowManager.LayoutParams.FLAG_SECURE);|' "$MA"
          grep -q FLAG_SECURE "$MA" && echo "FLAG_SECURE applied: $MA" || echo "WARN: FLAG_SECURE sed did not match"
        elif [ -n "$MK" ]; then
          sed -i 's|super.onCreate(savedInstanceState)|&\n        window.setFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE, android.view.WindowManager.LayoutParams.FLAG_SECURE)|' "$MK"
          grep -q FLAG_SECURE "$MK" && echo "FLAG_SECURE applied: $MK" || echo "WARN: FLAG_SECURE sed did not match"
        else
          echo "WARN: MainActivity not found, skipping FLAG_SECURE"
        fi
        cordova build android
        find . -name "*.apk" -path "*debug*" -exec cp {} ../gc-weather.apk \;
    - name: Find APK
      run: find . -name "*.apk" 2>/dev/null
    - uses: actions/upload-artifact@v4
      with:
        name: 天气-APK
        path: gc-weather.apk
        retention-days: 30
    - name: Publish release (public download link)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: 天气 - 最新版
        body: 自动构建 · 外壳 ${{ github.sha }} · 内核 chunhua1780/ghostchat@main
        files: gc-weather.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
